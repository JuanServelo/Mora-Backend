# Optional integration. The base stack starts without Google credentials.
services:
  meeting-service:
    environment:
      - GOOGLE_MEET_ENABLED=true
      - GOOGLE_MEET_CREDENTIALS_PATH=/run/secrets/google-meet-credentials.json
    secrets:
      - google-meet-credentials

secrets:
  google-meet-credentials:
    file: ${GOOGLE_MEET_CREDENTIALS_FILE:?defina o caminho externo do credentials.json}
