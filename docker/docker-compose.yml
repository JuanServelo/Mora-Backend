services:
  # 1. Serviço de Descoberta (Consul)
  consul:
    image: hashicorp/consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    networks:
      - microservices-net

  # 2. API Gateway (Traefik)
  traefik:
    image: traefik:v2.9
    container_name: traefik-gateway
    depends_on:
      - consul
    ports:
      - "8080:8080"
      - "8087:8087"
    networks:
      - microservices-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--entrypoints.web.address=:8087"
      - "--providers.consulcatalog=true"
      - "--providers.consulcatalog.endpoint.address=consul:8500"
      - "--providers.consulcatalog.exposedByDefault=false"
      - "--providers.consul.endpoints=consul:8500"
      - "--providers.consul.rootkey=traefik/config"

  # 3. Banco de Dados PostgreSQL (unico para todos os servicos)
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mora}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Vibers@2112}
    ports:
      # 5433 no host: a 5432 costuma estar ocupada por uma instalacao nativa do
      # PostgreSQL, que vence o bind e faz o host falhar a autenticacao.
      # Os servicos em containers seguem usando postgres:5432 pela rede interna.
      - "5433:5432"
    networks:
      - microservices-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql

  # 4. Microservice 1: Portaria (Java)
  portaria-service:
    build:
      context: ../services/portaria-service
      dockerfile: Dockerfile
    container_name: portaria-service
    depends_on:
      - consul
      - postgres
    networks:
      - microservices-net
    ports:
      - "8090:8090"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-mora}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Vibers@2112}
      - JWT_SECRET=${JWT_SECRET:-uma-chave-secreta-muito-segura-de-32-caracteres}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      # Quem mora em qual unidade é dado do auth-api (RN-06).
      - AUTH_API_URL=http://auth-api:3001
      - TZ=America/Sao_Paulo

  # 5. DESATIVADO — vagas-service migrado para portaria-service (Fase 3)
  # vagas-service:
  #   build:
  #     context: ../services/vagas-service
  #     dockerfile: Dockerfile
  #   container_name: vagas-service
  #   depends_on:
  #     - consul
  #     - postgres
  #   networks:
  #     - microservices-net
  #   ports:
  #     - "8092:8092"
  #   environment:
  #     - POSTGRES_HOST=postgres
  #     - POSTGRES_DB=vagas_db
  #     - POSTGRES_USER=${POSTGRES_USER:-admin}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Vibers@2112}
  #     - SPRING_CLOUD_CONSUL_HOST=consul
  #     - SPRING_CLOUD_CONSUL_PORT=8500

  # 5.5. Microservice: Comunicação — avisos, artigos, notificações, chat
  comunicacao-service:
    build:
      context: ../services/comunicacao-service
      dockerfile: Dockerfile
    container_name: comunicacao-service
    depends_on:
      - consul
      - postgres
    networks:
      - microservices-net
    ports:
      - "8094:8094"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-mora}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Vibers@2112}
      - JWT_SECRET=${JWT_SECRET:-uma-chave-secreta-muito-segura-de-32-caracteres}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      # Resolve nome e foto da contraparte de uma conversa, sempre em nome de
      # quem pediu. Sem isto a conversa aparece sem o nome — falha macia.
      - AUTH_API_URL=http://auth-api:3001
      # Credencial que outro servico apresenta para publicar notificacao sem
      # usuario logado — o caso e o fechamento de competencia do financeiro,
      # que roda por job. Sem ela, /interno responde 503 em vez de ficar aberta.
      - SERVICO_TOKEN=${SERVICO_TOKEN:-}
      - TZ=America/Sao_Paulo
    volumes:
      # Imagens dos avisos. A coluna `imagem_url` aponta para estes arquivos:
      # sem volume eles sumiriam no primeiro rebuild e a referencia ficaria
      # apontando para 404 — foi o que aconteceu com as fotos de perfil do
      # auth-api antes do `auth_uploads`.
      - comunicacao_uploads:/app/uploads

  # 6. Microservice 3: Meetings e Atas (Java)
  meeting-service:
    build:
      context: ../services/meeting
      dockerfile: Dockerfile
    container_name: meeting-service
    depends_on:
      - consul
      - postgres
    networks:
      - microservices-net
    ports:
      - "8091:8091"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mora_meeting
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-Vibers@2112}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - TZ=America/Sao_Paulo
    volumes:
      - ../tokens:/app/tokens

  # 7.5. Microservice 4: Planos SaaS (Java)
  plan-service:
    build:
      context: ../services/plan-service
      dockerfile: Dockerfile
    container_name: plan-service
    depends_on:
      - consul
      - postgres
    networks:
      - microservices-net
    ports:
      - "8093:8093"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mora_plan
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-Vibers@2112}
      - JWT_SECRET=${JWT_SECRET:-uma-chave-secreta-muito-segura-de-32-caracteres}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - TZ=America/Sao_Paulo

  # 7. Auth API (Node.js)
  auth-api:
    build:
      context: ../services/auth-api
      dockerfile: Dockerfile
    container_name: auth-api
    depends_on:
      - consul
      - postgres
    networks:
      - microservices-net
    ports:
      - "3001:3001"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Vibers@2112}
      - JWT_SECRET=${JWT_SECRET:-uma-chave-secreta-muito-segura-de-32-caracteres}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:3001/api/auth/google/callback}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_FROM=${MAIL_FROM}
      # A regra de turno do funcionário vive no portaria-service; o auth-api
      # a consulta antes de registrar a entrada (RF-09).
      - PORTARIA_SERVICE_URL=http://portaria-service:8090
      - TZ=America/Sao_Paulo
    volumes:
      # As fotos de perfil sao gravadas em disco, e a coluna fotoUrl no banco
      # aponta para elas. Sem volume, os arquivos ficam na camada gravavel do
      # container: qualquer `up --build` ou recreate apaga todos, e o banco
      # segue apontando para arquivos que nao existem mais — a tela do usuario
      # passa a mostrar imagem quebrada e ninguem entende por que.
      #
      # Comprovado: avatar-1-1789002352592.jpg estava no banco e respondia 404.
      - auth_uploads:/app/uploads

  # 7.9. Gestao Geral (Node) — agrega dados da plataforma para o Admin Geral
  gestao-geral:
    build:
      context: ../services/gestao-geral
      dockerfile: Dockerfile
    container_name: gestao-geral
    depends_on:
      - auth-api
      - consul
    networks:
      - microservices-net
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - SERVICE_HOST=gestao-geral
      # Mesmo segredo do auth-api: valida os tokens que ele emite.
      - JWT_SECRET=${JWT_SECRET:-uma-chave-secreta-muito-segura-de-32-caracteres}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - AUTH_API_URL=http://auth-api:3001
      - PORTARIA_SERVICE_URL=http://portaria-service:8090
      - PLAN_SERVICE_URL=http://plan-service:8093
      - COMUNICACAO_SERVICE_URL=http://comunicacao-service:8094
      - TZ=America/Sao_Paulo

  # 7.95. Financeiro (Node) — faturas, cobrancas, multas e prestacao de contas
  financeiro:
    build:
      context: ../services/financeiro
      dockerfile: Dockerfile
    container_name: financeiro
    depends_on:
      - postgres
      - auth-api
      - consul
    networks:
      - microservices-net
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - PORT=3004
      - CONSUL_HOST=consul
      - CONSUL_PORT=8500
      - SERVICE_HOST=financeiro
      # Mesmo segredo do auth-api: valida os tokens que ele emite.
      - JWT_SECRET=${JWT_SECRET:-uma-chave-secreta-muito-segura-de-32-caracteres}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=mora_financeiro
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Vibers@2112}
      - AUTH_API_URL=http://auth-api:3001
      - PORTARIA_SERVICE_URL=http://portaria-service:8090
      - PLAN_SERVICE_URL=http://plan-service:8093
      # Caixa de entrada do usuario: o financeiro publica notificacao la, nao
      # guarda a propria. Sem SERVICO_TOKEN o fechamento roda e so a
      # notificacao deixa de sair.
      - COMUNICACAO_SERVICE_URL=http://comunicacao-service:8094
      - SERVICO_TOKEN=${SERVICO_TOKEN:-}
      # Envio de aviso de fatura. Sem estas, o servico sobe e so o e-mail falha.
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASS=${MAIL_PASS}
      - MAIL_FROM=${MAIL_FROM}
      # Credenciais do gateway: sem default, e sem entrar no repositorio.
      # Defina em docker/.env — o servico sobe sem elas, so as rotas de
      # cobranca ficam indisponiveis.
      - ASAAS_BASE_URL=${ASAAS_BASE_URL:-https://api-sandbox.asaas.com/v3}
      - ASAAS_API_KEY=${ASAAS_API_KEY:-}
      - ASAAS_WEBHOOK_TOKEN=${ASAAS_WEBHOOK_TOKEN:-}
      - TZ=America/Sao_Paulo

  # 8. pgAdmin (visualizador do banco de dados)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@mora.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    networks:
      - microservices-net
    depends_on:
      - postgres

volumes:
  postgres_data:
  auth_uploads:
  comunicacao_uploads:

networks:
  microservices-net:
    driver: bridge
