services:
  # 1. Serviço de Descoberta (Consul)
  consul:
    image: hashicorp/consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    networks:
      - microservices-net
    # Descoberta de serviços em dev não precisa persistir estado. Manter o
    # data-dir efêmero evita o erro "refusing to rejoin cluster" após o container
    # ficar parado por mais de server_rejoin_age_max (7 dias).
    tmpfs:
      - /consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 6

  # 2. API Gateway (Traefik)
  traefik:
    image: traefik:v2.9
    container_name: traefik-gateway
    depends_on:
      - consul
    ports:
      - "8080:8080"
      - "8087:8087"
    networks:
      - microservices-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--entrypoints.web.address=:8087"
      - "--providers.consulcatalog=true"
      - "--providers.consulcatalog.endpoint.address=consul:8500"
      - "--providers.consulcatalog.exposedByDefault=false"
      - "--providers.consul.endpoints=consul:8500"
      - "--providers.consul.rootkey=traefik/config"

  # 3. Message Broker (RabbitMQ) — pub/sub entre auth_db e mora_db
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-mora}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD:-mora}
    ports:
      - "5672:5672"    # protocolo AMQP
      - "15672:15672"  # painel de gerenciamento (http://localhost:15672)
    networks:
      - microservices-net
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5

  # 4. Banco de Dados PostgreSQL (unico para todos os servicos)
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-mora}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Vibers@2112}
    ports:
      # Host 5432 costuma estar ocupado por um PostgreSQL nativo (Windows).
      # Publicamos em 5544 no host para nao conflitar; dentro da rede docker
      # os servicos continuam usando "postgres:5432".
      - "5544:5432"
    networks:
      - microservices-net
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-mora}"]
      interval: 10s
      timeout: 5s
      retries: 6

  # 4. Microservice 1: Portaria (Java)
  portaria-service:
    build:
      context: ../services/portaria-service
      dockerfile: Dockerfile
    container_name: portaria-service
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net
    ports:
      - "8090:8090"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-mora}
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Vibers@2112}
      - JWT_SECRET=${JWT_SECRET:-uma-chave-secreta-muito-segura-de-32-caracteres}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=${RABBITMQ_USER:-mora}
      - SPRING_RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD:-mora}
      - TZ=America/Sao_Paulo

  # 5. Microservice 2: Vagas de Estacionamento (Java)
  vagas-service:
    build:
      context: ../services/vagas-service
      dockerfile: Dockerfile
    container_name: vagas-service
    depends_on:
      - consul
      - postgres
    networks:
      - microservices-net
    ports:
      - "8092:8092"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=vagas_db
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Vibers@2112}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500

  # 6. Microservice 3: Meetings e Atas (Java)
  meeting-service:
    build:
      context: ../services/meeting
      dockerfile: Dockerfile
    container_name: meeting-service
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - microservices-net
    ports:
      - "8091:8091"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mora
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-Vibers@2112}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - TZ=America/Sao_Paulo

  # 7.5. Microservice 4: Planos SaaS (Java)
  plan-service:
    build:
      context: ../services/plan-service
      dockerfile: Dockerfile
    container_name: plan-service
    depends_on:
      - consul
      - postgres
    networks:
      - microservices-net
    ports:
      - "8093:8093"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mora_plan
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-admin}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-Vibers@2112}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - TZ=America/Sao_Paulo

  # 7. Auth API (Node.js)
  auth-api:
    build:
      context: ../services/auth-api
      dockerfile: Dockerfile
    container_name: auth-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservices-net
    ports:
      - "3001:3001"
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=auth_db
      - POSTGRES_USER=${POSTGRES_USER:-admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-Vibers@2112}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER:-mora}:${RABBITMQ_PASSWORD:-mora}@rabbitmq:5672
      - JWT_SECRET=${JWT_SECRET:-troque-por-uma-chave-secreta}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_CALLBACK_URL=${GOOGLE_CALLBACK_URL:-http://localhost:3001/api/auth/google/callback}
      - TZ=America/Sao_Paulo

  # 8. pgAdmin (visualizador do banco de dados)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@mora.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    networks:
      - microservices-net
    depends_on:
      - postgres

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  microservices-net:
    driver: bridge
