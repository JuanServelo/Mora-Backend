services:
  # 1. Serviço de Descoberta (Consul)
  consul:
    image: hashicorp/consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    networks:
      - microservices-net

  # 2. API Gateway (Traefik)
  traefik:
    image: traefik:v2.9
    container_name: traefik-gateway
    depends_on:
      - consul
    ports:
      - "8080:8080"
      - "8087:8087"
    networks:
      - microservices-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--entrypoints.web.address=:8087"
      - "--providers.consulcatalog=true"
      - "--providers.consulcatalog.endpoint.address=consul:8500"
      - "--providers.consulcatalog.exposedByDefault=false"
      - "--providers.consul=true"
      - "--providers.consul.endpoint.address=consul:8500"
      - "--providers.consul.rootkey=traefik/config"

  # 3. MongoDB (para Auth API)
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - microservices-net

  # 4. Microservice 1: Portaria (Java)
  portaria-service:
    build:
      context: ../services/portaria-service
      dockerfile: Dockerfile
    container_name: portaria-service
    depends_on:
      - consul
    networks:
      - microservices-net
    ports:
      - "8090:8090"
    
volumes:
  mongodb_data:

networks:
  microservices-net:
    driver: bridge