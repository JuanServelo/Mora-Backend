services:
  # 1. Serviço de Descoberta (Consul)
  consul:
    image: hashicorp/consul:1.15
    container_name: consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    command: agent -server -ui -node=server-1 -bootstrap-expect=1 -client=0.0.0.0
    networks:
      - microservices-net

  # 2. API Gateway (Traefik)
  traefik:
    image: traefik:v2.9
    container_name: traefik-gateway
    depends_on:
      - consul
    ports:
      - "8080:8080"
      - "8087:8087"
    networks:
      - microservices-net
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "--api.insecure=true"
      - "--api.dashboard=true"
      - "--log.level=INFO"
      - "--entrypoints.web.address=:8087"
      - "--providers.consulcatalog=true"
      - "--providers.consulcatalog.endpoint.address=consul:8500"
      - "--providers.consulcatalog.exposedByDefault=false"
      - "--providers.consul=true"
      - "--providers.consul.endpoint.address=consul:8500"
      - "--providers.consul.rootkey=traefik/config"

  # 3. MongoDB (para Auth API)
  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - microservices-net

  # 4. Microservice 1: Portaria (Java)
  portaria-service:
    build:
      context: ../services/portaria-service
      dockerfile: Dockerfile
    container_name: portaria-service
    depends_on:
      - consul
    networks:
      - microservices-net
    ports:
      - "8090:8090"

  # 5. Banco de Dados Relacional (Para o Meeting Service)
  mysql-db:
    image: mysql:8.0
    container_name: mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: mora
    ports:
      - "3306:3306"
    networks:
      - microservices-net
    volumes:
      - mysql_data:/var/lib/mysql

  # 6. Microservice 2: Meetings e Atas
  meeting-service:
    build:
      context: ../services/meeting
      dockerfile: Dockerfile
    container_name: meeting-service
    depends_on:
      - consul
      - mysql-db
    networks:
      - microservices-net
    ports:
      - "8091:8091"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql-db:3306/mora
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}

volumes:
  mongodb_data:
  mysql_data:

networks:
  microservices-net:
    driver: bridge