server:
  port: 8093
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: plan-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:mora_plan}}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
      pool-name: HikariPoolPlans

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  # O banco é criado e atualizado pelo Flyway (db/migration).
  flyway:
    enabled: true
    table: flyway_historico_plan
    baseline-on-migrate: true
    baseline-version: 0

  sql:
    init:
      mode: never

  cloud:
    consul:
      enabled: ${SPRING_CLOUD_CONSUL_ENABLED:true}
      host: ${SPRING_CLOUD_CONSUL_HOST:localhost}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      discovery:
        register: ${SPRING_CLOUD_CONSUL_ENABLED:true}
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: false
        hostname: ${SERVICE_HOSTNAME:plan-service}
        tags:
          - "traefik.enable=true"
          - "traefik.http.routers.plan.rule=PathPrefix(`/api/plans`) || PathPrefix(`/api/assinaturas`)"
          - "traefik.http.routers.plan.entrypoints=web"
        health-check-path: /actuator/health
        health-check-interval: 15s
    service-registry:
      auto-registration:
        enabled: ${SPRING_CLOUD_CONSUL_ENABLED:true}
    compatibility-verifier:
      enabled: false

jwt:
  secret: ${JWT_SECRET}

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api/plans/v3/api-docs
  swagger-ui:
    path: /api/plans/swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health
