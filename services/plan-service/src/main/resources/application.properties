spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:mora_plan}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Quem cria e evolui o banco é o Flyway (db/migration); o Hibernate só confere
# e impede o serviço de subir se faltar coluna. baseline-version=0 faz o V1,
# que é idempotente, rodar também no banco que já existe.
spring.flyway.enabled=true
spring.flyway.table=flyway_historico_plan
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=never

# Swagger / OpenAPI. Sob /api/plans para o gateway alcançar: o portal /docs
# reúne a especificação de todos os serviços pelo Traefik.
springdoc.api-docs.path=/api/plans/v3/api-docs
springdoc.swagger-ui.path=/api/plans/swagger-ui.html

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPoolPlans

server.port=8093
spring.application.name=plan-service
spring.cloud.consul.discovery.tags=traefik.enable=true,traefik.http.routers.plan.rule=PathPrefix(`/api/plans`) || PathPrefix(`/api/assinaturas`),traefik.http.routers.plan.entrypoints=web

spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.consul.enabled=${SPRING_CLOUD_CONSUL_ENABLED:false}
spring.cloud.service-registry.auto-registration.enabled=${SPRING_CLOUD_CONSUL_ENABLED:false}

spring.cloud.compatibility-verifier.enabled=false

spring.cloud.consul.discovery.prefer-ip-address=false
spring.cloud.consul.discovery.hostname=plan-service

management.endpoints.web.exposure.include=health
