spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:mora_meeting}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Quem cria e evolui o banco e o Flyway (db/migration); o Hibernate so confere
# e impede o servico de subir se faltar coluna. baseline-version=0 faz o V1,
# que e idempotente, rodar tambem no banco que ja existe.
spring.flyway.enabled=true
spring.flyway.table=flyway_historico_meeting
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Desabilitar execucao automatica do schema.sql (o banco e criado pelo Flyway)
spring.sql.init.mode=never

springdoc.api-docs.path=/api/meetings/v3/api-docs
springdoc.swagger-ui.path=/api/meetings/swagger-ui.html
server.forward-headers-strategy=framework

spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=HikariPoolMeetings

server.port=8091
spring.application.name=meeting-service
spring.cloud.consul.enabled=${SPRING_CLOUD_CONSUL_ENABLED:true}
spring.cloud.service-registry.auto-registration.enabled=${SPRING_CLOUD_CONSUL_ENABLED:true}
spring.cloud.consul.discovery.tags=traefik.enable=true,traefik.http.routers.meeting.rule=PathPrefix(`/api/meetings`) || PathPrefix(`/api/polls`),traefik.http.routers.meeting.entrypoints=web
spring.cloud.consul.host=${SPRING_CLOUD_CONSUL_HOST:localhost}
spring.cloud.consul.port=${SPRING_CLOUD_CONSUL_PORT:8500}
spring.cloud.compatibility-verifier.enabled=false
spring.cloud.consul.discovery.prefer-ip-address=false
spring.cloud.consul.discovery.hostname=${SERVICE_HOSTNAME:meeting-service}
management.endpoints.web.exposure.include=health

jwt.secret=${JWT_SECRET}
google.meet.enabled=${GOOGLE_MEET_ENABLED:true}
google.meet.credentials-path=${GOOGLE_MEET_CREDENTIALS_PATH:}
google.meet.tokens-path=${GOOGLE_MEET_TOKENS_PATH:/app/tokens}
google.meet.redirect-uri=${GOOGLE_MEET_REDIRECT_URI:http://localhost:8087/api/meetings/google/callback}
google.meet.frontend-url=${GOOGLE_MEET_FRONTEND_URL:http://localhost:5173/adm/reunioes}
