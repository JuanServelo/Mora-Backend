spring.datasource.url=jdbc:h2:mem:meeting-tests;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
# H2 uses Hibernate; production migrations require PostgreSQL.
spring.flyway.enabled=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
spring.cloud.consul.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
spring.cloud.compatibility-verifier.enabled=false
jwt.secret=meeting-tests-secret-with-more-than-32-characters
google.meet.enabled=false
google.meet.credentials-path=
google.meet.tokens-path=target/test-tokens
springdoc.api-docs.path=/api/meetings/v3/api-docs
springdoc.swagger-ui.path=/api/meetings/swagger-ui.html
