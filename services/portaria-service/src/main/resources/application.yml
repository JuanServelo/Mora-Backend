server:
  port: 8090
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: portaria-service

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:mora}
    password: ${SPRING_RABBITMQ_PASSWORD:mora}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          initial-interval: 3s
          max-attempts: 3

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:mora}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:Vibers@2112}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:localhost}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      discovery:
        register: true
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: true
        tags:
          - "traefik.enable=true"
          - "traefik.http.routers.portaria.rule=PathPrefix(`/api/portaria`)"
          - "traefik.http.routers.portaria.entrypoints=web"
          - "traefik.http.middlewares.portaria-stripprefix.stripprefix.prefixes=/api/portaria"
          - "traefik.http.routers.portaria.middlewares=portaria-stripprefix"

        health-check-path: /actuator/health
        health-check-interval: 15s

jwt:
  secret: ${JWT_SECRET:changeme-insecure-default}

management:
  endpoints:
    web:
      exposure:
        include: health

# Mensageria pub/sub (Banco MORA consome eventos do Banco AUTH).
# Defina como false para subir o serviço sem depender do broker.
mora:
  messaging:
    enabled: ${MORA_MESSAGING_ENABLED:true}
