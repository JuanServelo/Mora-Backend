server:
  port: 8090
  # Respeita o X-Forwarded-Prefix do Traefik: o Swagger monta o endereço do
  # servidor como /api/portaria, e o "Try it out" passa pelo gateway.
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

# Quem mora em qual unidade é dado do auth-api. O portaria-service consulta
# esta URL para validar vínculos de pessoas (RN-06).
auth:
  api:
    url: ${AUTH_API_URL:http://localhost:3001}

spring:
  application:
    name: portaria-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:mora}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Quem cria e evolui o banco é o Flyway, com os scripts de db/migration.
  # O `mora` é dividido com o comunicacao-service, então cada serviço tem a sua
  # tabela de histórico. `baseline-version: 0` faz o V1 rodar também em banco
  # que já existe (ele é idempotente): sem isso, o segundo serviço a subir
  # num banco novo acharia o esquema "não vazio" e pularia o próprio V1.
  flyway:
    enabled: true
    table: flyway_historico_portaria
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      # O Hibernate só confere: se a entidade pedir coluna que o banco não tem,
      # o serviço não sobe, em vez de criar uma estrutura incompleta.
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:localhost}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      discovery:
        register: true
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: true
        tags:
          - "traefik.enable=true"
          - "traefik.http.routers.portaria.rule=PathPrefix(`/api/portaria`)"
          - "traefik.http.routers.portaria.entrypoints=web"
          - "traefik.http.middlewares.portaria-stripprefix.stripprefix.prefixes=/api/portaria"
          - "traefik.http.routers.portaria.middlewares=portaria-stripprefix"
          - "traefik.http.routers.vagas-compat.rule=PathPrefix(`/api/vagas`)"
          - "traefik.http.routers.vagas-compat.entrypoints=web"
          - "traefik.http.middlewares.vagas-compat-stripprefix.stripprefix.prefixes=/api/vagas"
          - "traefik.http.routers.vagas-compat.middlewares=vagas-compat-stripprefix"

        health-check-path: /actuator/health
        health-check-interval: 15s

jwt:
  secret: ${JWT_SECRET:changeme-insecure-default}

management:
  endpoints:
    web:
      exposure:
        include: health
