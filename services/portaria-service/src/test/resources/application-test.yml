spring:
  datasource:
    url: jdbc:h2:mem:portaria_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # Os scripts do Flyway são de PostgreSQL; no H2 dos testes o esquema sai
  # das entidades.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  cloud:
    consul:
      enabled: false
      discovery:
        register: false
