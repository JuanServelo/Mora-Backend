server:
  port: 8094
  # Respeita o X-Forwarded-Prefix do Traefik: o Swagger monta o endereço do
  # servidor como /api/comunicacao, e o "Try it out" passa pelo gateway.
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: comunicacao-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:mora}
    username: ${POSTGRES_USER:admin}
    # Sem valor padrão: a senha vem do docker/.env e não pode estar no repositório.
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # Imagem de aviso: o limite precisa ficar acima do que a tela aceita, para o
  # erro chegar com mensagem nossa e não como conexão cortada.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # Quem cria e evolui o banco é o Flyway, com os scripts de db/migration.
  # O `mora` é dividido com o portaria-service, então cada serviço tem a sua
  # tabela de histórico. `baseline-version: 0` faz o V1 rodar também em banco
  # que já existe (ele é idempotente): sem isso, o segundo serviço a subir
  # num banco novo acharia o esquema "não vazio" e pularia o próprio V1.
  flyway:
    enabled: true
    table: flyway_historico_comunicacao
    baseline-on-migrate: true
    baseline-version: 0

  # Fila de notificações: outros serviços publicam, este consome e grava na
  # caixa de entrada (ver NotificacaoConsumer). Broker fora do ar não impede o
  # serviço de subir — o consumidor reconecta sozinho quando ele voltar.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        # Falha passageira (banco ocupado) ganha mais duas tentativas; depois a
        # mensagem é descartada com log, em vez de voltar à fila para sempre.
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
        default-requeue-rejected: false

  jpa:
    hibernate:
      # O Hibernate só confere: se a entidade pedir coluna que o banco não tem,
      # o serviço não sobe, em vez de criar a coluna por conta própria.
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:localhost}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      discovery:
        register: true
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: true
        tags:
          - "traefik.enable=true"
          - "traefik.http.routers.comunicacao.rule=PathPrefix(`/api/comunicacao`)"
          - "traefik.http.routers.comunicacao.entrypoints=web"
          - "traefik.http.middlewares.comunicacao-stripprefix.stripprefix.prefixes=/api/comunicacao"
          - "traefik.http.routers.comunicacao.middlewares=comunicacao-stripprefix"
        health-check-path: /actuator/health
        health-check-interval: 15s

# O servico consulta o auth-api para resolver nome e foto da contraparte de uma
# conversa, sempre em nome de quem pediu (repassando o Bearer). Sem isso a
# conversa aparece sem o nome — falha macia, de proposito.
auth:
  api:
    url: ${AUTH_API_URL:http://auth-api:3001}

# Sem valor padrão de propósito: antes era `changeme-insecure-default`, e um
# deploy sem a variável subia aceitando tokens assinados com uma chave pública.
# Agora o serviço recusa subir (ver JwtUtil).
jwt:
  secret: ${JWT_SECRET:}

# Credencial dos outros serviços na rota /interno. Vazia = rota fechada (503).
servico:
  token: ${SERVICO_TOKEN:}

# A exchange onde os serviços publicam, e a fila deste consumidor.
notificacoes:
  exchange: ${NOTIFICACOES_EXCHANGE:mora.notificacoes}
  fila: comunicacao.notificacoes

# Onde ficam as imagens dos avisos. No Docker é o volume comunicacao_uploads.
uploads:
  dir: ${UPLOADS_DIR:/app/uploads}

management:
  endpoints:
    web:
      exposure:
        include: health
  # O broker fora do ar não pode tirar o comunicacao do gateway: avisos, chat e
  # a caixa de entrada continuam funcionando; só a fila espera ele voltar.
  health:
    rabbit:
      enabled: false
