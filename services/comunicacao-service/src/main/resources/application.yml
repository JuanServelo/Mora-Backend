server:
  port: 8094
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: comunicacao-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/${POSTGRES_DB:mora}
    username: ${POSTGRES_USER:admin}
    password: ${POSTGRES_PASSWORD:Vibers@2112}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    deserialization:
      # O auth-api pode ganhar campos novos no usuario sem quebrar este servico.
      fail-on-unknown-properties: false

  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:localhost}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      discovery:
        register: true
        instance-id: ${spring.application.name}:${random.value}
        prefer-ip-address: true
        tags:
          - "traefik.enable=true"
          - "traefik.http.routers.comunicacao.rule=PathPrefix(`/api/comunicacao`)"
          - "traefik.http.routers.comunicacao.entrypoints=web"
          - "traefik.http.middlewares.comunicacao-stripprefix.stripprefix.prefixes=/api/comunicacao"
          - "traefik.http.routers.comunicacao.middlewares=comunicacao-stripprefix"
        health-check-path: /actuator/health
        health-check-interval: 15s

# Dono da identidade dos usuarios: este servico guarda apenas ids.
auth-api:
  url: ${AUTH_API_URL:http://localhost:3001}

jwt:
  secret: ${JWT_SECRET:changeme-insecure-default}

management:
  endpoints:
    web:
      exposure:
        include: health
